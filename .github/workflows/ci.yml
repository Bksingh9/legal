name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (high + critical only)
        run: npm audit --audit-level=high

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://legaldesk.ai

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

  # Production smoke — runs the full 109-test suite against the live
  # deploy. Gated on a pull_request to main so we don't hammer prod on
  # every internal push. Skipped if the required secrets aren't set
  # (e.g. on a fork) — open the GitHub repo Settings → Secrets and
  # Variables → Actions and add:
  #   NEXT_PUBLIC_SUPABASE_URL
  #   NEXT_PUBLIC_SUPABASE_ANON_KEY
  #   SUPABASE_SERVICE_ROLE_KEY
  #   RATE_LIMIT_BYPASS_KEY  (so tests aren't rate-limited)
  #   PROD_URL               (e.g. https://legaldesk-ai.vercel.app)
  prod-smoke:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check secrets
        id: secrets
        run: |
          if [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "Secrets missing — skipping prod smoke. Add SUPABASE_SERVICE_ROLE_KEY etc. in repo settings to enable."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Playwright browsers
        if: steps.secrets.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium firefox

      - name: Run production smoke against live deploy
        if: steps.secrets.outputs.skip != 'true'
        run: npx playwright test --config=playwright.prod.config.ts --reporter=github
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RATE_LIMIT_BYPASS_KEY: ${{ secrets.RATE_LIMIT_BYPASS_KEY }}

      - name: Upload Playwright report
        if: always() && steps.secrets.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Defensive cleanup of any leaked test users
        if: always() && steps.secrets.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Optional cleanup skipped (SUPABASE_ACCESS_TOKEN + SUPABASE_PROJECT_REF not set)."
            exit 0
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"delete from consultation_leads where created_at < now() - interval ''1 hour'' and name like ''QA %''"}' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" || true
